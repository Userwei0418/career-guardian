name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  market-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhihu/market-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zhihu/market-data/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. python -m unittest discover -s tests -v

  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql-test-password
          MYSQL_DATABASE: career_guardian_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci-mysql-test-password"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: zhihu/zhihu-backend
    env:
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://root:ci-mysql-test-password@127.0.0.1:3306/career_guardian_ci_test
      CAREER_GUARDIAN_TEST_DATABASE_URL: mysql+pymysql://root:ci-mysql-test-password@127.0.0.1:3306/career_guardian_ci_test
      JWT_SECRET: ci-test-secret-only-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: zhihu/zhihu-backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=.:tests python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhihu/zhihu-frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: zhihu/zhihu-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
